<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#FAF9F5" />
<title>Sem conexão — GBS</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF9F5; color: #1F1E1D;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; padding: 24px; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #262624; color: #FAF9F5; } p { color: #A6A39A !important; } }
  .g { width: 56px; height: 56px; border-radius: 16px; background: #C96442; color: #FDFBF6; display: grid; place-items: center;
       font: 32px Georgia, serif; margin: 0 auto 20px; }
  h1 { font: 400 28px Georgia, serif; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #73726C; max-width: 320px; }
  button { background: #C96442; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; }
</style>
</head>
<body>
  <main>
    <div class="g">G</div>
    <h1>Você está sem internet</h1>
    <p>O GBS precisa de conexão para mostrar seus dados com segurança. Assim que o sinal voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
